[package]
name = "oximon"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", features = ["file_watcher","bevy_debug_stepping","debug"] }
rand = "0.9.2"
bevy_ecs_tiled = { version = "0.11.4", features = ["avian"] }
avian2d = { version = "0.5.0", features = ["parry-f32"] }

[dev-dependencies]
paste = "1.0.15"

[profile.test]
debug = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
debug = true

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false
