[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/game"]

[workspace.dependencies]
bevy = "0.18.1"
rand = "0.9.2"
bevy_ecs_tiled = "0.11.4"
avian2d = { version = "0.5.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
paste = "1.0.15"

# interne crates
game_data = { path = "crates/game_data" }

[profile.test]
debug = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
debug = true

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[workspace.lints.clippy]
type_complexity = "allow"
