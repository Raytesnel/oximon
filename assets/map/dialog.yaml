npc_dude:
  dialogs:
    intro:
      conditions:
        starter_chosen: false
      lines:
        - speaker: npc_dude
          text: "Hello there! Finally a human i can talk to!"
        - speaker: npc_dude
          text: "My name is npc_dude."
        - speaker: player
          text: "uhm,,, i'm raytesnel?"
        - speaker: npc_dude
          text: "I found these 3 but im scared, can you take one to see what happens?"
        - speaker: player
          text: "uhm,, so you want me to be your guinny pig?"
      next: choose_pokemon

    choose_pokemon:
      conditions:
        starter_chosen: false
      lines:
        - speaker: npc_dude
          text: "Huh,, noo, surely it is fine, hurry up and take one of these three monsters."
      choices:
        - text: "Charmander"
          next: got_charmander
        - text: "Squirtle"
          next: got_squirtle
        - text: "Bulbasaur"
          next: got_bulbasaur

    got_charmander:
      conditions:
        starter_chosen: false
      lines:
        - speaker: npc_dude
          text: "A fiery choice! Charmander."
      quest_update:
        starter_chosen: true

    got_squirtle:
      conditions:
        starter_chosen: false
      lines:
        - speaker: npc_dude
          text: "A cool choice! Squirtle."
      quest_update:
        starter_chosen: true

    got_bulbasaur:
      conditions:
        starter_chosen: false
      lines:
        - speaker: npc_dude
          text: "A wise choice! Bulbasaur."
      quest_update:
        starter_chosen: true

    got_already:
      conditions: {}
      lines:
        - speaker: npc_dude
          text: "your still alive, great, now, i get the other two. bye bye"
